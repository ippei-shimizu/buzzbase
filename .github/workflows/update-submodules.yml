name: Update submodules

# サブモジュールの参照を .gitmodules の branch の最新に進め、main に直接 push する
# main はブランチ保護でレビュー必須のため、管理者の PAT（SUBMODULE_UPDATE_TOKEN）で push する

on:
  schedule:
    - cron: "0 * * * *" # 1時間ごと
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}

      - name: サブモジュールを最新に更新
        env:
          TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
        run: |
          # .gitmodules の SSH URL を、PAT 付きの HTTPS で取得できるようにする
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --remote

      - name: commit・push
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "更新なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix: サブプロジェクトのコミットIDを更新"
          git push origin HEAD:main
